name: Validate AWMM

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install validator dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate conforming examples
        run: python scripts/validate.py examples/
      - name: Confirm invalid fixture is rejected
        shell: bash
        run: |
          if python scripts/validate.py tests/invalid/unknown-asset-ref.json; then
            echo "Invalid fixture was incorrectly accepted."
            exit 1
          fi
          echo "Invalid fixture rejected as expected."
